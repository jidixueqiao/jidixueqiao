    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.045"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1.5" fill="#ffffff" opacity="0.035"/>
  </pattern>
  <clipPath id="panel"><rect x="1" y="1" width="654" height="452" rx="10"/></clipPath>
</defs>
<rect x="1" y="1" width="654" height="452" rx="10" fill="#0d1117"/>

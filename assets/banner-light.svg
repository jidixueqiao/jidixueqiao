<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="jidixueqiao — AI safety / MCP / SQL / Vue (light)">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fdf7ff"/>
      <stop offset="100%" stop-color="#f6ecff"/>
    </linearGradient>

    <linearGradient id="sunGradL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="42%" stop-color="#ffb38a"/>
      <stop offset="75%" stop-color="#ff8fb8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="neonL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="48%" stop-color="#e11d74"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <radialGradient id="bloomL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#d8b4fe" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d8b4fe" stop-opacity="0"/>
    </radialGradient>

    <pattern id="scanlinesL" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.6" fill="#7c3aed" opacity="0.045"/>
    </pattern>

    <filter id="bloomBlurL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="softTextGlowL" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <mask id="sunMaskL">
      <rect x="0" y="0" width="1200" height="360" fill="#000"/>
      <circle cx="600" cy="250" r="96" fill="#fff"/>
      <g fill="#000">
        <rect x="480" y="205" width="240" height="3"/>
        <rect x="480" y="216" width="240" height="4"/>
        <rect x="480" y="228" width="240" height="5"/>
        <rect x="480" y="241" width="240" height="6"/>
        <rect x="480" y="255" width="240" height="7"/>
        <rect x="480" y="270" width="240" height="8"/>
        <rect x="480" y="286" width="240" height="9"/>
        <rect x="480" y="303" width="240" height="10"/>
      </g>
    </mask>

    <clipPath id="gridClipL">
      <rect x="0" y="255" width="1200" height="105"/>
    </clipPath>

    <style>
      .mono { font-family: 'JetBrains Mono','Cascadia Mono','SF Mono',ui-monospace,Consolas,'Liberation Mono',monospace; }
      .pulse { animation: pulse 3.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="360" fill="url(#bgL)"/>

  <!-- 太阳光晕 -->
  <ellipse cx="600" cy="250" rx="230" ry="150" fill="url(#bloomL)" filter="url(#bloomBlurL)" class="pulse"/>

  <!-- 条纹太阳 -->
  <g mask="url(#sunMaskL)">
    <circle cx="600" cy="250" r="96" fill="url(#sunGradL)"/>
  </g>
  <g mask="url(#sunMaskL)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 22" dur="5s" repeatCount="indefinite"/>
    <g fill="#000">
      <rect x="480" y="205" width="240" height="3"/>
      <rect x="480" y="216" width="240" height="4"/>
      <rect x="480" y="228" width="240" height="5"/>
      <rect x="480" y="241" width="240" height="6"/>
      <rect x="480" y="255" width="240" height="7"/>
      <rect x="480" y="270" width="240" height="8"/>
      <rect x="480" y="286" width="240" height="9"/>
      <rect x="480" y="303" width="240" height="10"/>
    </g>
  </g>

  <!-- 地平线 -->
  <rect x="0" y="253" width="1200" height="3" fill="url(#neonL)" opacity=".85"/>

  <!-- 透视网格 -->
  <g clip-path="url(#gridClipL)" stroke="url(#neonL)" fill="none">
    <g opacity=".38">
      <path d="M600 255 L-600 360"/>
      <path d="M600 255 L-400 360"/>
      <path d="M600 255 L-200 360"/>
      <path d="M600 255 L0 360"/>
      <path d="M600 255 L200 360"/>
      <path d="M600 255 L400 360"/>
      <path d="M600 255 L600 360"/>
      <path d="M600 255 L800 360"/>
      <path d="M600 255 L1000 360"/>
      <path d="M600 255 L1200 360"/>
      <path d="M600 255 L1400 360"/>
      <path d="M600 255 L1600 360"/>
      <path d="M600 255 L1800 360"/>
    </g>
    <g opacity=".3" stroke-width="1">
      <path d="M0 258 H1200"/>
      <path d="M0 267 H1200"/>
      <path d="M0 282 H1200"/>
      <path d="M0 303 H1200"/>
      <path d="M0 330 H1200"/>
      <path d="M0 360 H1200"/>
    </g>
  </g>

  <!-- 标题（浅色主题：深墨色 + 霓虹色差） -->
  <g class="mono" font-size="64" font-weight="700" letter-spacing="7" text-anchor="middle">
    <text x="597" y="132" fill="#06b6d4" opacity=".28">jidixueqiao</text>
    <text x="603" y="132" fill="#e11d74" opacity=".28">jidixueqiao</text>
    <text x="600" y="132" fill="#1b1035" filter="url(#softTextGlowL)">jidixueqiao</text>
  </g>

  <!-- 副标题 -->
  <text class="mono" x="600" y="172" font-size="17" letter-spacing="6.5" text-anchor="middle" fill="#7c3aed" opacity=".9">
    AI SAFETY · MCP SERVER · SQL · VUE · NETWORK
  </text>

  <!-- 终端标签 -->
  <text class="mono" x="42" y="44" font-size="15" fill="#0891b2" opacity=".9">$ whoami</text>
  <text class="mono" x="1158" y="44" font-size="15" fill="#be185d" opacity=".9" text-anchor="end">~/jidixueqiao</text>
  <text class="mono" x="42" y="66" font-size="12" fill="#475569" opacity=".7">uid=1000(jidixueqiao) gid=1000(builders)</text>

  <!-- 底部状态栏 -->
  <g class="mono" font-size="12.5" letter-spacing="1">
    <rect x="42" y="326" width="9" height="9" rx="1" fill="#06b6d4" class="pulse"/>
    <text x="60" y="335" fill="#334155" opacity=".85">build: passing</text>
    <text x="1158" y="335" fill="#64748b" opacity=".8" text-anchor="end">sql_mcp · ai-minesweeper · person-web</text>
  </g>

  <!-- 轻扫描线 -->
  <rect width="1200" height="360" fill="url(#scanlinesL)"/>
</svg>
